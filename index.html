<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doodle Kalendaryo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="2" seed="4" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="3"/></filter></svg>
<div class="wrap"><div class="sheet">
<div class="rings"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="head"><button class="nav" id="prev" aria-label="Previous month">‹</button><h1 id="title"></h1><button class="nav" id="next" aria-label="Next month">›</button></div>
<div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
<div class="grid" id="grid"></div>
<button class="btn today" id="todayBtn">Today</button>
</div></div>
<div class="ov" id="ov"></div>
<div class="card" id="card"></div>
<script src="script.js"></script></body></html>
